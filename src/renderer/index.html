<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://cdn.jsdelivr.net 'unsafe-eval';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
    font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:;
    img-src 'self' data: https:;
    connect-src 'self' https://cdn.jsdelivr.net;
  ">
  <title>Gero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0F1117;
      --surface:      #1A1D27;
      --border:       #2A2D3A;
      --amber:        #EF9F27;
      --amber-dark:   #B86E00;
      --amber-bg:     #2A1A04;
      --gold:         #F5C842;
      --text:         #FFFFFF;
      --text-2:       #9CA3AF;
      --text-3:       #6B7280;
      --green:        #1D9E75;
      --blue:         #3B6FE8;
      --purple:       #7F77DD;
      --red:          #D85A30;
      --radius:       8px;
      --radius-lg:    12px;
      --sidebar-w:    220px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── App shell ── */
    #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; border-radius: 10px; }
    #app-body { flex: 1; display: flex; overflow: hidden; min-height: 0; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w);
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow-y: auto; overflow-x: hidden;
    }
    .sidebar-nav { flex: 1; padding: 8px 0; }

    /* Primary group label (non-accordion) */
    .nav-group-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.8px;
      color: var(--text-3); text-transform: uppercase;
      padding: 12px 16px 4px;
    }

    /* Accordion group */
    .nav-group { margin: 1px 0; }
    .nav-group-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; cursor: pointer;
      color: var(--text-3); font-size: 10px; font-weight: 600;
      letter-spacing: 0.8px; text-transform: uppercase;
      user-select: none; transition: color 0.15s;
    }
    .nav-group-header:hover { color: var(--text-2); }
    .nav-group-open .nav-group-header { color: var(--text-2); }

    .nav-group-chevron {
      flex-shrink: 0;
      transition: transform 0.22s ease;
      color: var(--text-3);
    }
    .nav-group-open .nav-group-chevron { transform: rotate(180deg); color: var(--amber); }

    /* Animated collapse — CSS grid trick */
    .nav-group-items { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.22s ease; }
    .nav-group-open .nav-group-items { grid-template-rows: 1fr; }
    .nav-group-items > div { overflow: hidden; }

    /* Nav items */
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px; color: var(--text-2); cursor: pointer;
      transition: all 0.15s; border-right: 2px solid transparent;
      text-decoration: none; font-size: 13px; user-select: none;
    }
    .nav-item:hover { background: rgba(239,159,39,0.08); color: var(--text); }
    .nav-item.active { background: rgba(239,159,39,0.10); color: var(--amber); border-right-color: var(--amber); }
    .nav-item i { font-size: 16px; width: 18px; text-align: center; flex-shrink: 0; }

    /* Sidebar footer */
    .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: 11px; color: var(--text-3); text-transform: capitalize; }
    .logout-btn { background: none; border: none; color: var(--text-3); cursor: pointer; padding: 4px; border-radius: 4px; transition: color 0.15s; }
    .logout-btn:hover { color: var(--red); }

    /* ── Topbar — full width, spans from left edge ── */
    .topbar {
      height: 52px; min-height: 52px;
      display: flex; align-items: center;
      background: var(--surface); border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
      flex-shrink: 0;
    }

    /* Brand section — same width as sidebar */
    .topbar-brand {
      width: var(--sidebar-w); min-width: var(--sidebar-w);
      display: flex; align-items: center; gap: 10px;
      padding: 0 16px; border-right: 1px solid var(--border);
      flex-shrink: 0; -webkit-app-region: no-drag;
    }
    .topbar-brand-name { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; color: var(--amber); }

    /* Body: title + draggable region + win controls */
    .topbar-body {
      flex: 1; display: flex; align-items: center;
      padding: 0 16px; gap: 12px; min-width: 0;
    }
    .topbar-title { font-size: 14px; font-weight: 600; color: var(--text-2); flex-shrink: 0; }

    /* Window controls — far right */
    .win-controls {
      display: flex; align-items: center; gap: 2px;
      margin-left: auto; padding-left: 12px; flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .wc-btn {
      width: 34px; height: 28px; border-radius: 6px;
      background: rgba(255,255,255,0.04); color: var(--text-2);
      border: 0.5px solid transparent;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px; line-height: 1; cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      -webkit-app-region: no-drag;
    }
    .wc-btn:hover { background: rgba(255,255,255,0.10); color: var(--text); border-color: var(--border); }
    .wc-close:hover { background: var(--red); color: #fff; border-color: var(--red); }

    /* ── Main content area ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .content { flex: 1; overflow-y: auto; padding: 24px; }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; margin: 2px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover  { background: rgba(239,159,39,0.5); }
    ::-webkit-scrollbar-thumb:active { background: var(--amber); }
    ::-webkit-scrollbar-corner { background: transparent; }
    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

    /* ── Cards ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .card-header h2 { font-size: 15px; font-weight: 600; }
    .card-body { padding: 20px; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); border: none; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; font-family: inherit; }
    .btn-primary   { background: var(--amber); color: #fff; }
    .btn-primary:hover   { background: var(--amber-dark); }
    .btn-secondary { background: var(--surface); color: var(--text-2); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); color: var(--text); }
    .btn-danger    { background: rgba(216,90,48,0.15); color: var(--red); }
    .btn-danger:hover    { background: rgba(216,90,48,0.25); }
    .btn-ghost     { background: none; color: var(--text-2); }
    .btn-ghost:hover     { background: rgba(255,255,255,0.06); color: var(--text); }
    .btn-sm   { padding: 4px 10px; font-size: 12px; }
    .btn-icon { padding: 7px; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Forms ── */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
    .form-control { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; color: var(--text); font-size: 13px; font-family: inherit; transition: border-color 0.15s; outline: none; }
    .form-control:focus { border-color: var(--amber); }
    .form-control::placeholder { color: var(--text-3); }
    select.form-control { cursor: pointer; }
    .form-row   { display: grid; gap: 16px; }
    .form-row-2 { grid-template-columns: 1fr 1fr; }
    .form-row-3 { grid-template-columns: 1fr 1fr 1fr; }

    /* ── Table ── */
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 16px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    tbody td { padding: 12px 16px; border-bottom: 1px solid rgba(42,45,58,0.5); font-size: 13px; color: var(--text-2); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(255,255,255,0.02); color: var(--text); }
    .td-mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
    .td-name { color: var(--text); font-weight: 500; }

    /* ── Badges ── */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge-success { background: rgba(29,158,117,0.15);  color: var(--green); }
    .badge-warning { background: rgba(239,159,39,0.15);  color: var(--amber); }
    .badge-danger  { background: rgba(216,90,48,0.15);   color: var(--red); }
    .badge-info    { background: rgba(127,119,221,0.15); color: var(--purple); }
    .badge-neutral { background: rgba(156,163,175,0.15); color: var(--text-2); }
    .badge-accent  { background: var(--amber-bg);        color: var(--amber); }

    /* ── Avatar ── */
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }

    /* ── Modal ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(2px); }
    .modal-overlay.visible { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 520px; max-width: 90vw; max-height: 85vh; display: flex; flex-direction: column; }
    .modal-lg { width: 720px; }
    .modal-header { padding: 20px 24px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .modal-header h2 { font-size: 16px; font-weight: 600; }
    .modal-close { background: none; border: none; color: var(--text-3); font-size: 20px; cursor: pointer; padding: 4px; border-radius: 4px; line-height: 1; }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

    /* ── Toast ── */
    .toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; }
    .toast { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: var(--radius); border: 1px solid; font-size: 13px; min-width: 280px; max-width: 380px; animation: slideIn 0.2s ease; }
    .toast-success { background: rgba(29,158,117,0.12); border-color: rgba(29,158,117,0.3); color: var(--green); }
    .toast-error   { background: rgba(216,90,48,0.12);  border-color: rgba(216,90,48,0.3);  color: var(--red); }
    .toast-info    { background: rgba(59,111,232,0.12); border-color: rgba(59,111,232,0.3); color: var(--blue); }
    .toast-warning { background: rgba(239,159,39,0.12); border-color: rgba(239,159,39,0.3); color: var(--amber); }
    @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

    /* ── Pagination ── */
    .pagination { display: flex; align-items: center; gap: 6px; padding: 16px 20px; border-top: 1px solid var(--border); justify-content: space-between; }
    .pagination-info { font-size: 12px; color: var(--text-3); }
    .pagination-btns { display: flex; gap: 4px; }
    .page-btn { width: 30px; height: 30px; border-radius: var(--radius); border: 1px solid var(--border); background: none; color: var(--text-2); font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .page-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .page-btn.active { background: var(--amber); border-color: var(--amber); color: #fff; }
    .page-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-3); }
    .empty-state i { font-size: 48px; margin-bottom: 16px; display: block; }
    .empty-state h3 { font-size: 16px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; }

    /* ── Loading / Spinner ── */
    .loading { display: flex; align-items: center; justify-content: center; padding: 60px; color: var(--text-3); }
    .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--amber); border-radius: 50%; animation: spin 0.6s linear infinite; }
    .spin { animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Page header ── */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .page-header h1 { font-size: 20px; font-weight: 700; }
    .page-actions { display: flex; align-items: center; gap: 10px; }

    /* ── Dashboard grid ── */
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .dashboard-grid .full { grid-column: span 2; }

    /* ── Page transitions ── */
    .page-enter { animation: fadeIn 0.15s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ── Detail view ── */
    .detail-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .detail-label { font-size: 12px; color: var(--text-3); min-width: 140px; }
    .detail-value { font-size: 13px; color: var(--text); }

    /* ── Login page ── */
    .login-page {
      flex: 1; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--bg);
      background-image: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(239,159,39,0.08) 0%, transparent 70%);
      -webkit-app-region: drag;
    }
    .login-box { width: 400px; display: flex; flex-direction: column; align-items: center; -webkit-app-region: no-drag; }
    .login-logo { text-align: center; margin-bottom: 36px; }
    .login-logo .wordmark { font-size: 32px; font-weight: 300; letter-spacing: -1px; margin: 14px 0 6px; color: var(--amber); }
    .login-logo .tagline  { font-size: 12px; color: var(--text-3); letter-spacing: 0.3px; }
    .login-card { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; }
    .login-card h2 { font-size: 17px; font-weight: 600; margin-bottom: 24px; text-align: center; }
    .login-error { background: rgba(216,90,48,0.1); border: 1px solid rgba(216,90,48,0.2); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; color: var(--red); margin-bottom: 16px; }
    .login-btn { width: 100%; padding: 11px; font-size: 14px; font-weight: 600; margin-top: 4px; }
    .login-footer { text-align: center; margin-top: 24px; font-size: 11px; color: var(--text-3); }

    /* ── Misc utilities ── */
    .text-success { color: var(--green); }
    .text-danger  { color: var(--red); }
    .text-warning { color: var(--amber); }
    .text-info    { color: var(--purple); }
    .text-muted   { color: var(--text-3); }
    .text-right   { text-align: right; }
    .text-center  { text-align: center; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .mb-4 { margin-bottom: 16px; }
    .mt-4 { margin-top: 16px; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    hr.divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
    .w-full { width: 100%; }
    .note-box { background: rgba(239,159,39,0.06); border: 1px solid rgba(239,159,39,0.18); border-radius: var(--radius); padding: 12px 16px; font-size: 12px; color: var(--text-2); margin-top: 12px; }

    /* ── Global Search ── */
    .gs-wrap { position: relative; flex: 1; max-width: 440px; display: flex; align-items: center; -webkit-app-region: no-drag; }
    .gs-input {
      width: 100%; height: 34px;
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 0 44px 0 32px; color: var(--text); font-size: 13px; font-family: inherit;
      outline: none; transition: border-color 0.15s; -webkit-app-region: no-drag;
    }
    .gs-input:focus { border-color: var(--amber); }
    .gs-input::placeholder { color: var(--text-3); }
    .gs-icon { position: absolute; left: 10px; color: var(--text-3); font-size: 14px; pointer-events: none; }
    .gs-kbd {
      position: absolute; right: 8px;
      font-size: 10px; color: var(--text-3);
      background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 4px;
      padding: 2px 5px; font-family: 'JetBrains Mono', monospace; pointer-events: none; transition: opacity 0.1s;
    }
    .gs-input:focus + .gs-kbd { opacity: 0; }
    .gs-dropdown {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
      box-shadow: 0 12px 32px rgba(0,0,0,0.5); z-index: 500;
      max-height: 420px; overflow-y: auto;
    }
    .gs-section { font-size: 10px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-3); padding: 10px 14px 4px; }
    .gs-item { display: flex; align-items: center; gap: 10px; padding: 8px 14px; cursor: pointer; transition: background 0.1s; }
    .gs-item:hover, .gs-item.gs-active { background: rgba(239,159,39,0.08); }
    .gs-icon-box { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .gs-item-info { flex: 1; min-width: 0; }
    .gs-item-title { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gs-item-sub { font-size: 11px; color: var(--text-3); margin-top: 1px; }
    .gs-empty { padding: 24px 14px; text-align: center; color: var(--text-3); font-size: 13px; }
    .gs-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

    /* Icon box color variants */
    .gs-icon-amber { background: rgba(239,159,39,0.12); color: var(--amber); }
    .gs-icon-blue  { background: rgba(59,111,232,0.14); color: var(--blue); }
    .gs-icon-green { background: rgba(29,158,117,0.14); color: var(--green); }

    /* ── Transaction-code (tx) mode ── */
    .gs-mode-badge {
      position: absolute; left: 8px; z-index: 1;
      display: flex; align-items: center;
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
      color: var(--amber); background: var(--amber-bg); border: 1px solid var(--amber-dark);
      border-radius: 4px; padding: 2px 6px;
      font-family: 'JetBrains Mono', monospace; pointer-events: none;
    }
    .gs-tx-mode .gs-input { padding-left: 48px; border-color: var(--amber); }
    .gs-item-tx { gap: 12px; }
    .tx-code {
      font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
      color: var(--amber); background: var(--amber-bg); border: 1px solid var(--border);
      border-radius: 5px; padding: 3px 7px; min-width: 48px; text-align: center; flex-shrink: 0;
    }
    .tx-item-icon { font-size: 16px; color: var(--text-3); width: 18px; text-align: center; flex-shrink: 0; }
    .tx-badge {
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px;
      color: var(--green); background: rgba(29,158,117,0.14); border-radius: 4px;
      padding: 2px 6px; flex-shrink: 0;
    }

    /* ── Utilities ── */
    .hidden { display: none !important; }

    /* ── Studio layout ── */
    .studio-layout { display: grid; grid-template-columns: 200px 1fr; grid-template-rows: 1fr 200px; height: calc(100vh - 52px); gap: 0; }
    .studio-tree { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; grid-row: span 2; }
    .studio-editor { grid-row: 1; overflow: hidden; }
    .studio-terminal { background: #0D0F14; border-top: 1px solid var(--border); overflow-y: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 10px; color: #9CA3AF; }
  </style>
</head>
<body>
  <!-- Loading screen: visible until auth check completes -->
  <div id="loading-screen" style="position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999">
    <div class="spinner"></div>
  </div>

  <!-- Main app shell: shown after authentication -->
  <div id="app" style="display:none">
    <div class="topbar">
      <div class="topbar-brand">
        <svg width="26" height="26" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="20" r="10" fill="#EF9F27"/>
          <circle cx="12" cy="46" r="8"  fill="#EF9F27" opacity="0.7"/>
          <circle cx="52" cy="46" r="8"  fill="#EF9F27" opacity="0.7"/>
          <line x1="24" y1="27" x2="16" y2="39" stroke="#EF9F27" stroke-width="2.5" opacity="0.5"/>
          <line x1="40" y1="27" x2="48" y2="39" stroke="#EF9F27" stroke-width="2.5" opacity="0.5"/>
        </svg>
        <span class="topbar-brand-name">Gero</span>
      </div>
      <div class="topbar-body" id="topbar"></div>
    </div>
    <div id="app-body">
      <div class="sidebar" id="sidebar"></div>
      <div class="main">
        <div class="content" id="content"></div>
      </div>
    </div>
  </div>

  <!-- Modal root (populated by components/modal.ts) -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-box" style="padding:24px"></div>
  </div>

  <div class="toast-container" id="toasts"></div>
  <script type="module" src="index.js"></script>
</body>
</html>
